<header class="topbar">

  <div class="page-context">
    <span class="breadcrumb">Workspace</span>
    <span class="breadcrumb-separator">/</span>
    <span class="current-page">Command Center</span>
  </div>

  <div class="topbar-actions">

    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input
        type="search"
        placeholder="Search incidents, workflows..."
        aria-label="Search FlowOps"
      />
      <span class="shortcut">⌘ K</span>
    </div>

    <button
      type="button"
      class="icon-button notification-button"
      aria-label="Notifications"
    >
      ♧
      <span class="notification-dot"></span>
    </button>

    <div class="profile">
      <div class="avatar">TR</div>

      <div class="profile-info">
        <span class="profile-name">Tapan Ray</span>
        <span class="profile-role">Administrator</span>
      </div>

      <span class="profile-chevron">⌄</span>
    </div>

  </div>

</header>
